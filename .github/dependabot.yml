# Keeps the SHA-pinned actions current. Dependabot rewrites both the SHA and
# the trailing version comment, so pinning costs nothing in maintenance.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
