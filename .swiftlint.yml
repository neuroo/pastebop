# SwiftLint configuration for PasteBop.
#
#   swiftlint                  # lint
#   swiftlint --fix            # apply the mechanical fixes
#   swiftlint analyze --compiler-log-path <log>   # dead-code rules, see CI

included:
  - Sources
  - Tests
  - Scripts
  - Package.swift

excluded:
  - .build
  - dist

disabled_rules:
  # Trailing commas in multi-line literals keep diffs to one line, and Swift
  # itself moved towards allowing them everywhere.
  - trailing_comma

# Need the compiler log: see the "Dead code" job in CI.
analyzer_rules:
  - unused_declaration
  - unused_import

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - direct_return
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - period_spacing
  - prefer_self_in_static_references
  - prefer_zero_over_explicit_init
  - private_action
  - redundant_nil_coalescing
  - redundant_type_annotation
  - return_value_from_void_function
  - self_binding
  - shorthand_optional_binding
  - sorted_first_last
  - static_operator
  - superfluous_else
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unhandled_throwing_task
  - vertical_whitespace_closing_braces
  - yoda_condition

line_length:
  warning: 110
  error: 130
  ignores_urls: true
  ignores_comments: false

identifier_name:
  # Swift's own conventions produce plenty of short, clear names.
  min_length: 2
  allowed_symbols: ["_"]

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 400
  error: 500
  ignore_comment_only_lines: true

function_body_length:
  warning: 60
  error: 100

nesting:
  # Codable puts CodingKeys inside the type that declares it, which is already
  # two levels down inside a namespace enum.
  type_level: 2

cyclomatic_complexity:
  warning: 12
  error: 18
